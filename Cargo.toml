[package]
name = "quimera-agent-mutation"
version = "0.1.0"
edition = "2021"
authors = ["Dr. Gemirson dos Santos Silva <g324198@dac.unicamp.br>"]
description = "REA (Reverse Engineer Anything) + Complex Systems Mutation Testing Engine for AI Agents"

[[bin]]
name = "quimera-agent-mutate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
